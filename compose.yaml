name: oauthq-local

services:
  php:
    build:
      context: ./docker-images/php
      dockerfile: ${PHP_VERSION:-8.5}/Dockerfile
    image: oauthq-local/php:${PHP_VERSION:-8.5}
    environment:
      APP_ENV: local
    volumes:
      - ./src:/var/www/html:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  nginx:
    build:
      context: ./docker-images/nginx
      dockerfile: stable/Dockerfile
    image: oauthq-local/nginx:stable
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
